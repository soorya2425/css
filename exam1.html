<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Product table</title>
    <style>
table {
  border-collapse:collapse;
  width: 50%;
  margin:auto;
}

table, th, td {
  border: 2px solid black;
 
}

th, td {
  background-color: gray;
  color: white;
  text-align: center;
  padding: 5px;

}
h2{
    text-align:center;
}

</style>
</head>

<body>

<h2 >Product Table</h2>

<table>
  <tr>
    <th>ID</th>
    <th>Product Name</th>
    <th>Product Price</th>
  </tr>

  <tr>
    <td>1</td>
    <td>Pen</td>
    <td>10</td>
  </tr>

  <tr>
    <td>2</td>
    <td>Notebook</td>
    <td>50</td>
  </tr>

  <tr>
    <td>3</td>
    <td>Pencil</td>
    <td>5</td>
  </tr>

  <tr>
    <td>4</td>
    <td>Eraser</td>
    <td>3</td>
  </tr>

  <tr>
    <td>5</td>
    <td>Sharpener</td>
    <td>8</td>
  </tr>

</table>
</body>
</html>
