<!DOCTYPE html>
<html>
<head>
<style>


section p::first-line {
  font-weight: bold;
}

section p::first-letter {
  color: red;
  font-size: 24px;
}

h3 + h3 {
  color: green;
}


a {
  color: blue;
}

a:visited {
  color: purple;
}

a:hover {
  text-decoration: underline;
}

li:first-child a {
  color: red;
}

</style>
</head>
<body>

<section>
  <h2>Welcome Section</h2>
  <p>This is the first paragraph. It contains some sample text for styling.</p>
  <p>This is the second paragraph. It also has some text to test CSS.</p>
</section>

<div>
  <h3>First Heading</h3>
  <h3>Second Heading</h3>
</div>

<div>
  <ul>
    <li><a href="#">First Link</a></li>
    <li><a href="#">Second Link</a></li>
    <li><a href="#">Third Link</a></li>
  </ul>
</div>

</body>
</html>
